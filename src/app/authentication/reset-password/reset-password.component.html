<div *ngIf="!resetPasswordShow">

  <form [formGroup]="resetForm" (ngSubmit)="onSubmit()">
    <div class="row g-margin-b-40--xs">
      <div class="col-sm-12 g-margin-b-20--xs g-margin-b-0--md">
        <div class="g-margin-b-20--xs">
          <input type="email" formControlName="email" class="form-control s-form-v4__input g-radius--50"
                 placeholder="* Enter Email" [ngClass]="{ 'is-invalid': submitted && f.email.errors }"/>
          <div *ngIf="submitted && f.email.errors" class="invalid-feedback">
            <div *ngIf="f.email.errors['required']">Registered email is required</div>
          </div>
        </div>
        <div *ngIf="forbidden" class="text-left mt-2 mb-4 text-center" style="font-size: 0.875em; color: var(--bs-form-invalid-color);">
          {{forbidden}}
        </div>
      </div>



      <div class="text-right mt-3 mb-3">
        <button type="submit"
                class="text-uppercase btn btn-dark btn-sm " [disabled]="disableResetButton">Reset Password
        </button>
      </div>
    </div>
  </form>

</div>
<div *ngIf="resetPasswordShow">
  <h6 class="text-center mt-4 mb-4">Password recovery details have been sent to the registered email </h6>

  <form [formGroup]="resetFormId" (ngSubmit)="onSubmitIdChecker()">
    <div class="input-group mb-3">
      <input formControlName="resetId" type="text" class="form-control" placeholder="Enter Code" aria-label="Recipient’s username" aria-describedby="button-addon2">
      <button class="btn btn-outline-secondary" type="submit" id="button-addon2" [disabled]="disableResetCodeButton">Update</button>
    </div>

    <div *ngIf="submitted && frid.resetId.errors" class="text-center">
      <div *ngIf="frid.resetId.errors['required']" style="font-size: 0.875em; color: var(--bs-form-invalid-color);">reset code is required</div>
    </div>
</form>



<div *ngIf="codeIdInvalid" class=" mt-2 border-danger-400 text-center accent-red-700">{{codeIdInvalid}}</div>
</div>
<div class="text-center mt-4 mb-4" >
  <a href="#" (click)="onResetPasswordCancel()" class="text-decoration-none mt-4 mb-4 a-link-grey">Back To login</a>

</div>
